# Build autonome (hors du build racine) : n'accepte que les cibles buildables sur
# la machine hôte (arm64 macOS → jvm + macosArm64).
kotlin.native.ignoreDisabledTargets=true
# Hiérarchie custom explicite (commonMain <- nativeMain <- macosArm64Main) dans build.gradle.kts
kotlin.mpp.applyDefaultHierarchyTemplate=false
