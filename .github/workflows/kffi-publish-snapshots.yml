name: kffi-publish-snapshots
on:
  # Manual trigger only while staged in wgpu4k-native. At the P5 split to
  # Graphiks-org/kffi, switch this back to:
  #   push:
  #     branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Publish snapshots
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          export VERSION="$(date +%Y%m%d%H%M%S)-SNAPSHOT"
          ./gradlew :kffi:publishAllPublicationsToMavenCentral \
            :kffi-benchmark-spi:publishAllPublicationsToMavenCentral
